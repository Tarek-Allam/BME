<script>
  var today = new Date().toISOString().split("T")[0];
  document.getElementById("reportDate").value = today;
  document.getElementById("endDate").value = today;

  var now = new Date();
  var timeStr = (now.getHours() < 10 ? "0" : "") + now.getHours() + ":" + (now.getMinutes() < 10 ? "0" : "") + now.getMinutes();
  document.getElementById("reportTime").value = timeStr;

  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbwOhQJU-q_1vbXS4hxJuHdgtSi2SD74odMa4WO296Y7Iv9VUvAlNJEsTbaXlJl3ZMXQug/exec";

  var loadedCasesData = {};

  function toggleActionType() {
    var action = document.getElementById("actionType").value;
    var taskGroup = document.getElementById("taskIdGroup");
    if (action === "UPDATE") {
      taskGroup.classList.remove("hidden");
      loadCasesViaJSONP();
    } else {
      taskGroup.classList.add("hidden");
      document.getElementById("medicalForm").reset();
      document.getElementById("reportDate").value = today;
      document.getElementById("endDate").value = today;
      document.getElementById("reportTime").value = timeStr;
    }
  }

  function loadCasesViaJSONP() {
    var dropdown = document.getElementById("caseDropdownSelect");
    dropdown.innerHTML = "<option value=''>جاري تحميل البلاغات...</option>";

    var oldScript = document.getElementById("jsonpScript");
    if (oldScript) oldScript.remove();

    var script = document.createElement("script");
    script.id = "jsonpScript";
    script.src = API_ENDPOINT + "?callback=handleJSONPResponse&t=" + new Date().getTime();
    
    script.onerror = function() {
      dropdown.innerHTML = "<option value=''>تعذر الاتصال بالخادم.</option>";
    };
    
    document.body.appendChild(script);
  }

  window.handleJSONPResponse = function(data) {
    var dropdown = document.getElementById("caseDropdownSelect");
    if (data && data.status === "success" && data.casesMap) {
      loadedCasesData = data.casesMap;
      var keys = Object.keys(loadedCasesData);

      if (keys.length > 0) {
        dropdown.innerHTML = "<option value=''>-- اختر كود المهمة المراد تحديثها --</option>";
        keys.forEach(function(caseId) {
          var option = document.createElement("option");
          option.value = caseId;
          option.text = caseId;
          dropdown.appendChild(option);
        });

        dropdown.onchange = populateFormFields;
      } else {
        dropdown.innerHTML = "<option value=''>لا توجد بلاغات مسجلة بالمستند</option>";
      }
    } else {
      dropdown.innerHTML = "<option value=''>فشل في جلب البيانات</option>";
    }
  };

  function populateFormFields() {
    var selectedId = document.getElementById("caseDropdownSelect").value;
    if (!selectedId || !loadedCasesData[selectedId]) return;

    var item = loadedCasesData[selectedId];

    var taskSelect = document.getElementById("taskSelect");
    if (setSelectValueIfExists(taskSelect, item.task)) {
      document.getElementById("otherTaskGroup").classList.add("hidden");
    } else {
      taskSelect.value = "أخرى";
      document.getElementById("otherTaskGroup").classList.remove("hidden");
      document.getElementById("otherTaskDetails").value = item.task.replace("أخرى (", "").replace(")", "");
    }

    var deviceSelect = document.getElementById("deviceSelect");
    if (setSelectValueIfExists(deviceSelect, item.device)) {
      document.getElementById("newDeviceGroup").classList.add("hidden");
    } else {
      deviceSelect.value = "NEW_DEVICE";
      document.getElementById("newDeviceGroup").classList.remove("hidden");
      document.getElementById("newDeviceName").value = item.device;
    }

    var engineerSelect = document.getElementById("engineerSelect");
    if (setSelectValueIfExists(engineerSelect, item.engineer)) {
      document.getElementById("newEngineerGroup").classList.add("hidden");
    } else {
      engineerSelect.value = "NEW";
      document.getElementById("newEngineerGroup").classList.remove("hidden");
      document.getElementById("newEngineerName").value = item.engineer;
    }

    document.getElementById("serialNumber").value = item.serial === "غير مسجل" ? "" : item.serial;
    document.getElementById("reportDate").value = item.reportDate || today;
    document.getElementById("reportTime").value = item.reportTime || timeStr;
    document.getElementById("endDate").value = item.endDate || today;
    document.getElementById("executionNotes").value = item.notes === "لم تذكر" ? "" : item.notes;
    document.getElementById("results").value = item.results === "لم تذكر" ? "" : item.results;
    document.getElementById("errors").value = item.errors === "لا توجد أخطاء" ? "" : item.errors;
  }

  function setSelectValueIfExists(selectElement, val) {
    for (var i = 0; i < selectElement.options.length; i++) {
      if (selectElement.options[i].value === val) {
        selectElement.selectedIndex = i;
        return true;
      }
    }
    return false;
  }

  function toggleInput(selectId, targetGroupId, triggerValue) {
    var select = document.getElementById(selectId);
    var group = document.getElementById(targetGroupId);
    if (select.value === triggerValue) {
      group.classList.remove("hidden");
    } else {
      group.classList.add("hidden");
    }
  }

  document.getElementById("medicalForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    var submitBtn = document.getElementById("submitBtn");
    var statusMsg = document.getElementById("statusMsg");
    var actionType = document.getElementById("actionType").value;
    var taskId = document.getElementById("caseDropdownSelect").value;

    if (actionType === "UPDATE" && !taskId) {
      alert("الرجاء اختيار كود المهمة المراد تحديثها من القائمة!");
      return;
    }
    
    submitBtn.disabled = true;
    submitBtn.innerText = "جاري الإرسال...";
    statusMsg.style.display = "none";

    var task = document.getElementById("taskSelect").value;
    if (task === "أخرى") {
      var od = document.getElementById("otherTaskDetails").value.trim();
      task = od ? "أخرى (" + od + ")" : "أخرى";
    }

    var device = document.getElementById("deviceSelect").value;
    if (device === "NEW_DEVICE") {
      var nd = document.getElementById("newDeviceName").value.trim();
      device = nd ? nd : "جهاز جديد غير معرف";
    }

    var engineer = document.getElementById("engineerSelect").value;
    if (engineer === "NEW") {
      engineer = document.getElementById("newEngineerName").value.trim();
    }

    var rt = document.getElementById("reporterSelect").value;
    var rn = document.getElementById("reporterName").value.trim();
    var reporterFull = rn ? rt + " (" + rn + ")" : rt;

    var payload = {
      actionType: actionType,
      taskId: taskId,
      task: task,
      device: device,
      serial: document.getElementById("serialNumber").value.trim(),
      reporter: reporterFull,
      manager: document.getElementById("responsibleManager").value,
      engineer: engineer,
      reportDate: document.getElementById("reportDate").value,
      reportTime: document.getElementById("reportTime").value,
      endDate: document.getElementById("endDate").value,
      executionNotes: document.getElementById("executionNotes").value.trim(),
      results: document.getElementById("results").value.trim(),
      errors: document.getElementById("errors").value.trim()
    };

    // إرسال البيانات عبر JSONP بدلاً من fetch(no-cors) لضمان دخولها لـ Google Doc
    var script = document.createElement("script");
    var encodedPayload = encodeURIComponent(JSON.stringify(payload));
    script.src = API_ENDPOINT + "?callback=handleSubmitSuccess&payload=" + encodedPayload + "&t=" + new Date().getTime();

    window.handleSubmitSuccess = function(res) {
      statusMsg.className = "status-msg status-success";
      statusMsg.innerText = actionType === "NEW" 
        ? "تم إضافة البلاغ بنجاح وتوثيقه بداخل المستند!" 
        : "تم تحديث البيانات للبلاغ بنجاح بداخل المستند!";
      
      document.getElementById("medicalForm").reset();
      document.getElementById("reportDate").value = today;
      document.getElementById("endDate").value = today;
      document.getElementById("reportTime").value = timeStr;
      
      submitBtn.disabled = false;
      submitBtn.innerText = "حفظ التقرير في المستند";
      statusMsg.style.display = "block";
      toggleActionType();
    };

    script.onerror = function() {
      statusMsg.className = "status-msg status-error";
      statusMsg.innerText = "حدث خطأ أثناء الاتصال بالخادم.";
      submitBtn.disabled = false;
      submitBtn.innerText = "حفظ التقرير في المستند";
      statusMsg.style.display = "block";
    };

    document.body.appendChild(script);
  });
</script>
