<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام توثيق الأجهزة الطبية | Eng. Tarek Allam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #0f62fe;
      --primary-hover: #0043ce;
      --bg-color: #f4f7fb;
      --card-bg: #ffffff;
      --text-main: #161616;
      --border-color: #e0e0e0;
      --accent-blue: #e8f1ff;
      --success-bg: #def8ee;
      --success-text: #0e6027;
      --error-bg: #ffe8e8;
      --error-text: #9e1a1a;
      --radius: 12px;
    }

    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-color); margin: 0; padding: 24px 12px; color: var(--text-main); direction: rtl; text-align: right; line-height: 1.6; }
    .container { max-width: 680px; margin: 0 auto; }

    .profile-card {
      background: linear-gradient(135deg, #0a2540 0%, #0052cc 100%);
      color: white; padding: 20px 24px; border-radius: var(--radius);
      margin-bottom: 24px; display: flex; align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(10, 37, 64, 0.15);
    }
    .profile-info h3 { margin: 0 0 2px 0; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .profile-info p { margin: 0; font-size: 13px; color: #d0e2ff; }
    .badge-verified { background: rgba(255, 255, 255, 0.2); font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: normal; }

    .action-btns { display: flex; gap: 8px; align-items: center; }
    .header-btn {
      background-color: #ffffff; color: #0052cc;
      padding: 8px 14px; border-radius: 8px; text-decoration: none;
      font-weight: 700; font-size: 13px;
      display: inline-flex; align-items: center; gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .header-btn:hover { background-color: var(--accent-blue); transform: translateY(-1px); }

    .form-wrapper {
      background: var(--card-bg); padding: 28px; border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0,0,0,0.03);
    }
    .form-header { margin-bottom: 24px; border-bottom: 2px solid var(--bg-color); padding-bottom: 12px; }
    .form-header h2 { margin: 0; font-size: 20px; color: #0a2540; font-weight: 800; }

    .form-section {
      background: #fafbfc; border: 1px solid var(--border-color);
      padding: 16px; border-radius: 10px; margin-bottom: 20px;
    }
    .section-title { font-size: 14px; color: var(--primary-color); margin-top: 0; margin-bottom: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    .form-group { margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }

    select, input, textarea {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1.5px solid var(--border-color); border-radius: 8px;
      background-color: #fff; color: var(--text-main);
      transition: all 0.2s ease-in-out;
    }
    select:focus, input:focus, textarea:focus {
      outline: none; border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.15);
    }
    textarea { resize: vertical; min-height: 80px; }
    .hidden { display: none !important; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    @media (max-width: 500px) {
      .grid-2 { grid-template-columns: 1fr; }
      .profile-card { flex-direction: column; align-items: flex-start; gap: 12px; }
      .action-btns { flex-direction: column; width: 100%; }
      .header-btn { width: 100%; justify-content: center; }
    }

    .btn-submit {
      width: 100%; padding: 14px; background-color: var(--primary-color);
      color: white; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px;
      box-shadow: 0 4px 12px rgba(15, 98, 254, 0.25);
      transition: all 0.2s ease;
    }
    .btn-submit:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    .btn-submit:disabled { background-color: #a8a8a8; cursor: not-allowed; }

    .btn-reset {
      width: 100%; background-color: transparent; color: #da1e28;
      border: 1px dashed #da1e28; margin-top: 12px; font-size: 13px;
      padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;
    }

    .status-msg {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      text-align: center; font-size: 14px; font-weight: 700; display: none;
    }
    .status-success { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #a7e1c4; }
    .status-error { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #f8b4b4; }
  </style>
</head>
<body>

<div class="container">

  <div class="profile-card">
    <div class="profile-info">
      <h3>Eng. Tarek Allam <span class="badge-verified">مُوثّق</span></h3>
      <p>Biomedical Equipment Engineer (BME)</p>
    </div>
    <div class="action-btns">
      <a href="https://docs.google.com/document/d/1lRtJn33qK8Ozlv0C7zCtmJpBU-N4VXqvyYnQEnj-aGk/edit?tab=t.0" target="_blank" rel="noopener noreferrer" class="header-btn">📄 فتح المستند</a>
      <a href="https://www.linkedin.com/in/tarekallam-bme/" target="_blank" rel="noopener noreferrer" class="header-btn">LinkedIn 🔗</a>
    </div>
  </div>

  <div class="form-wrapper">
    <div class="form-header">
      <h2>نظام توثيق وتفتيش المهام الهندسية الطبية</h2>
    </div>

    <form id="medicalForm">

      <div class="form-section" style="background-color: var(--accent-blue); border-color: #b8d5ff;">
        <div class="form-group" style="margin-bottom:0;">
          <label>نوع الإجراء المطلوب:</label>
          <select id="actionType" onchange="toggleActionType()">
            <option value="NEW">➕ إضافة بلاغ جديد</option>
            <option value="UPDATE">✏️ تحديث بيانات بلاغ حالي</option>
            <option value="DELETE">🗑️ حذف بلاغ من المستند</option>
          </select>
        </div>
        <div class="form-group hidden" id="taskIdGroup" style="margin-top:12px; margin-bottom:0;">
          <label>اختر رقم البلاغ المراد تحديثه/حذفه:</label>
          <select id="caseDropdownSelect"><option value="">جاري تحميل البلاغات...</option></select>
        </div>
      </div>

      <div id="formDetailsBody">
        <div class="form-section">
          <div class="section-title">🛠️ تفاصيل الجهاز والمهمة</div>

          <div class="form-group">
            <label>نوع المهمة:</label>
            <select id="taskSelect" onchange="toggleInput('taskSelect', 'otherTaskGroup', 'أخرى')">
              <option value="تجهيز جهاز طبي">تجهيز جهاز طبي</option>
              <option value="تركيب جهاز طبي">تركيب جهاز طبي</option>
              <option value="تركيب جهاز ديمو">تركيب جهاز ديمو</option>
              <option value="تفكيك جهاز طبي">تفكيك جهاز طبي</option>
              <option value="طلب صيانة">طلب صيانة</option>
              <option value="صيانة طوارئ">صيانة طوارئ</option>
              <option value="أخرى">أخرى...</option>
            </select>
          </div>

          <div class="form-group hidden" id="otherTaskGroup">
            <label>تفاصيل المهمة البديلة:</label>
            <input type="text" id="otherTaskDetails" placeholder="أدخل تفاصيل نوع المهمة البديلة">
          </div>

          <div class="form-group">
            <label>الجهة المراد تنفيذ المهمة بها:</label>
            <input type="text" id="location" placeholder="اسم المركز / العيادة / المستشفى / المدينة">
          </div>

          <div class="form-group">
            <label>نوع الجهاز:</label>
            <select id="deviceSelect" onchange="toggleInput('deviceSelect', 'newDeviceGroup', 'NEW_DEVICE')">
              <option value="INTALIGHT DREAM OCTA VG100D">INTALIGHT DREAM OCTA VG100D</option>
              <option value="INTALIGHT DREAM OCTA VG200D">INTALIGHT DREAM OCTA VG200D</option>
              <option value="INTALIGHT DREAM OCTA VG200C">INTALIGHT DREAM OCTA VG200C</option>
              <option value="OPTOVUE SOLIX OCTA">OPTOVUE SOLIX OCTA</option>
              <option value="OPTOVUE XRAVANTI OCTA">OPTOVUE XRAVANTI OCTA</option>
              <option value="OPTOVUE IVUE80 OCT">OPTOVUE IVUE80 OCT</option>
              <option value="OPTOVUE ISCAN OCT">OPTOVUE ISCAN OCT</option>
              <option value="OPTOVUE RTVUE100 OCT">OPTOVUE RTVUE100 OCT</option>
              <option value="MOVU Argos AS OCT">MOVU Argos AS OCT</option>
              <option value="DGH Ocular UtraSound A/B Scan">DGH Ocular UtraSound A/B Scan</option>
              <option value="DGH Ocular UtraSound A/B Scan and UBM">DGH Ocular UtraSound A/B Scan and UBM</option>
              <option value="MicroClear Apollo Laser Retinal Fundus Camera RB">MicroClear Apollo Laser Retinal Fundus Camera RB</option>
              <option value="MicroClear Apollo Laser Retinal Fundus Camera RGB v1.0">MicroClear Apollo Laser Retinal Fundus Camera RGB v1.0</option>
              <option value="MicroClear ApolloLaser Retinal Fundus Camera RGB v2.0">MicroClear ApolloLaser Retinal Fundus Camera RGB v2.0</option>
              <option value="RODENSTOCK Perimat Visual Field">RODENSTOCK Perimat Visual Field</option>
              <option value="RODENSTOCK Perimat2 Visual Field">RODENSTOCK Perimat2 Visual Field</option>
              <option value="RODENSTOCK Refraction Unit 500">RODENSTOCK Refraction Unit 500</option>
              <option value="RODENSTOCK Refraction Unit 1000">RODENSTOCK Refraction Unit 1000</option>
              <option value="RODENSTOCK Tonometer Topascope">RODENSTOCK Tonometer Topascope</option>
              <option value="Visionix Tulip Screen Portable Autorefractor autokeratometer">Visionix Tulip Screen Portable Autorefractor autokeratometer</option>
              <option value="Visionix Tulip sidetube Portable Autorefractor autokeratometer">Visionix Tulip sidetube Portable Autorefractor autokeratometer</option>
              <option value="REXONE EYE Resono Dry Eye Treatment">REXONE EYE Resono Dry Eye Treatment</option>
              <option value="SBM Dry Eye Diagnostics OS-1000">SBM Dry Eye Diagnostics OS-1000</option>
              <option value="Peschke PXL Corneal Cross linking SAPPHIRE 318">Peschke PXL Corneal Cross linking SAPPHIRE 318</option>
              <option value="Sterlink Plasmapp FPS-15s-Plus Low temp Plasma sterilizer">Sterlink Plasmapp FPS-15s-Plus Low temp Plasma sterilizer</option>
              <option value="ENBIO Autoclave">ENBIO Autoclave</option>
              <option value="W&H Autoclave">W&H Autoclave</option>
              <option value="NEW_DEVICE">إضافة جهاز جديد...</option>
            </select>
          </div>

          <div class="form-group hidden" id="newDeviceGroup">
            <label>اسم الجهاز الجديد:</label>
            <input type="text" id="newDeviceName" placeholder="أدخل طراز الجهاز الجديد">
          </div>

          <div class="form-group">
            <label>الرقم المسلسل (S/N):</label>
            <input type="text" id="serialNumber" placeholder="أدخل الرقم التسلسلي S/N">
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">👨‍⚕️ فريق العمل والمسؤولون</div>
          <div class="grid-2">
            <div class="form-group">
              <label>الشخص القائم بالإبلاغ:</label>
              <select id="reporterSelect">
                <option value="مدير القسم">مدير القسم</option>
                <option value="مدير الشركة">مدير الشركة</option>
              </select>
            </div>
            <div class="form-group">
              <label>اسم القائم بالإبلاغ (اختياري):</label>
              <input type="text" id="reporterName" placeholder="الاسم بالتفصيل">
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>المهندس المسؤول:</label>
              <select id="responsibleManager">
                <option value="طارق علام (مدير الصيانة)">طارق علام (مدير الصيانة)</option>
                <option value="مدير الصيانة">مدير الصيانة</option>
              </select>
            </div>
            <div class="form-group">
              <label>المهندس المكلف بالتنفيذ:</label>
              <select id="engineerSelect" onchange="toggleInput('engineerSelect', 'newEngineerGroup', 'NEW')">
                <option value="طارق علام">طارق علام</option>
                <option value="عمرو عباس">عمرو عباس</option>
                <option value="محمد ابراهيم">محمد ابراهيم</option>
                <option value="NEW">إضافة مهندس جديد...</option>
              </select>
            </div>
          </div>
          <div class="form-group hidden" id="newEngineerGroup">
            <label>اسم المهندس المكلف الجديد:</label>
            <input type="text" id="newEngineerName" placeholder="أدخل اسم المهندس الجديد">
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">📅 المواعيد والتوقيتات</div>
          <div class="grid-2">
            <div class="form-group">
              <label>تاريخ الإبلاغ:</label>
              <input type="date" id="reportDate">
            </div>
            <div class="form-group">
              <label>وقت الإبلاغ:</label>
              <input type="time" id="reportTime">
            </div>
          </div>
          <div class="form-group">
            <label>تاريخ الانتهاء المتوقع/الفعلي:</label>
            <input type="date" id="endDate">
          </div>
        </div>

        <div class="form-section">
          <div class="section-title">📝 التقرير الفني والنتائج</div>
          <div class="form-group">
            <label>تفاصيل ما تم تنفيذه:</label>
            <textarea id="executionNotes" placeholder="اكتب بالتفصيل خطوات العمل والإجراءات التي تمت..."></textarea>
          </div>
          <div class="form-group">
            <label>النتائج والتقييم النهائي:</label>
            <textarea id="results" placeholder="حالة الجهاز وكفاءة العمل بعد التنفيذ..."></textarea>
          </div>
          <div class="form-group">
            <label>الأخطاء والملاحظات (إن وجدت):</label>
            <textarea id="errors" placeholder="أي عقبات أو قطع غيار مطلوبة مستقبلاً..."></textarea>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">حفظ التقرير وتوثيقه بالمستند</button>
      <button type="button" class="btn-reset" onclick="resetCounter()">تصفير عداد الترقيم (البدء من 1000)</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>
</div>

<script>
  // ⚠️ IMPORTANT: replace this URL with the Web app URL shown in
  // Apps Script → Deploy → Manage deployments → Web app URL.
  // Never use "Deploy → New deployment" — always edit the existing
  // deployment and publish a "New version" so this URL stays valid.
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzyVGgzVq6CguwmsQ2fmM2s30ID28jb9XxWoF6EnwO4KcqNgeQCX85-A7EYjGAzKHy-rw/exec";

  var today = new Date().toISOString().split("T")[0];
  document.getElementById("reportDate").value = today;
  document.getElementById("endDate").value = today;

  var now = new Date();
  var timeStr = (now.getHours() < 10 ? "0" : "") + now.getHours() + ":" + (now.getMinutes() < 10 ? "0" : "") + now.getMinutes();
  document.getElementById("reportTime").value = timeStr;

  var loadedCasesData = {};

  function toggleActionType() {
    var action = document.getElementById("actionType").value;
    var taskGroup = document.getElementById("taskIdGroup");
    var detailsBody = document.getElementById("formDetailsBody");
    var submit
